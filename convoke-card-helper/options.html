<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Convoke Card Helper – Configurações</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d0f14; color: #e6e8ee; font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8b91a3; margin-bottom: 24px; }
  section { background: #11131a; border: 1px solid #2a2e3b; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #a78bfa; margin: 0 0 10px; }
  label { display: block; margin-bottom: 6px; color: #c3c7d4; }
  input[type=text], input[type=password], select {
    width: 100%; box-sizing: border-box; background: #0d0f14; color: #e6e8ee;
    border: 1px solid #2a2e3b; border-radius: 8px; padding: 8px 10px; font: inherit;
  }
  select[size] { padding: 4px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  .row > input[type=text], .row > input[type=password] { flex: 1; min-width: 200px; }
  button { background: #7c3aed; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid #2a2e3b; color: #c3c7d4; }
  .msg { font-size: 13px; color: #8b91a3; }
  .ok { color: #4ade80; } .err { color: #f87171; }
  a { color: #a78bfa; }
</style>
</head>
<body>
<main>
  <h1>Convoke Card Helper</h1>
  <div class="sub">Configuração do chat de IA (OpenRouter ou Groq).</div>

  <section>
    <h2>Provedor</h2>
    <select id="provider">
      <option value="openrouter">OpenRouter (muitos modelos, alguns gratuitos)</option>
      <option value="groq">Groq (gratuito com limites, muito rápido)</option>
    </select>
  </section>

  <section>
    <h2>Chave da API (token)</h2>
    <label for="key" id="keyHelp"></label>
    <div class="row">
      <input id="key" type="password" autocomplete="off">
      <button id="toggle" class="ghost" type="button">Mostrar</button>
      <button id="test" class="ghost" type="button">Testar</button>
    </div>
    <div id="keyMsg" class="msg"></div>
  </section>

  <section>
    <h2>Modelo</h2>
    <div class="row">
      <input id="search" type="text" placeholder="Buscar modelo (ex.: llama, gemini, deepseek)…">
      <label style="margin:0" id="freeRow"><input id="free" type="checkbox"> Somente gratuitos</label>
      <button id="refresh" class="ghost" type="button">Atualizar lista</button>
    </div>
    <select id="model" size="14"></select>
    <div id="modelMsg" class="msg" style="margin-top:6px"></div>
  </section>

  <div class="row">
    <button id="save" type="button">Salvar</button>
    <span id="saveMsg" class="msg"></span>
  </div>
</main>
<script src="options.js"></script>
</body>
</html>
